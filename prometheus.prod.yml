global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'picnest-api'
    metrics_path: '/metrics'
    scrape_interval: 15s
    static_configs:
      - targets: ['app:8000']
        labels:
          service: 'picnest-api'
          environment: 'production'
