# ============================================================================
# PicNest — общие настройки проксирования
# /etc/nginx/snippets/picnest-proxy.conf
# ============================================================================
# Вынесено в snippet, чтобы не дублировать блок между location'ами.
# include подставляет содержимое прямо в контекст location.
# ============================================================================

# HTTP/1.1 обязателен для keepalive и WebSocket
proxy_http_version 1.1;

# Заголовки идентификации клиента. app запущен с --proxy-headers и
# --forwarded-allow-ips *, поэтому request.client.host увидит реальный IP,
# и rate limiting в slowapi будет считать по клиенту, а не по всем сразу.
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host  $host;
proxy_set_header X-Request-ID      $request_id;

# WebSocket (на будущее)
proxy_set_header Upgrade    $http_upgrade;
proxy_set_header Connection $connection_upgrade;

# Таймауты
proxy_connect_timeout 10s;
proxy_send_timeout    60s;
proxy_read_timeout    60s;

# Буферизация: ответы FastAPI обычно небольшие, буфер ускоряет отдачу
proxy_buffering on;
proxy_buffer_size 8k;
proxy_buffers 8 8k;

# Если приложение упало — отдаём 502, а не висим
proxy_next_upstream error timeout invalid_header http_502 http_503;
