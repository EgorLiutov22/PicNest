# ============================================================================
# PicNest — фронтенд (React SPA) + проксирование API
# /etc/nginx/sites-available/picnest (тот же сайт, что и для API)
# ============================================================================
# Схема:
#   /            → статика из /var/www/picnest-front (SPA)
#   /api/        → FastAPI на 127.0.0.1:8000
#
# Фронтенд и API на одном origin, поэтому CORS не используется вовсе.
# ============================================================================

limit_req_zone $binary_remote_addr zone=picnest_api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=picnest_auth:10m rate=5r/s;
limit_conn_zone $binary_remote_addr zone=picnest_conn:10m;

upstream picnest_api {
    server 127.0.0.1:8000;
    keepalive 32;
}

# Пустое значение для обычных запросов: с "close" upstream получал
# Connection: close и keepalive в нём не работал.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      "";
}

server {
    listen 80;
    listen [::]:80;

    server_name _;

    server_tokens off;

    root /var/www/picnest-front;
    index index.html;

    client_max_body_size 10m;

    access_log /var/log/nginx/picnest-access.log;
    error_log  /var/log/nginx/picnest-error.log warn;

    # --- Статика -----------------------------------------------------------
    # Хешированные файлы Vite можно кэшировать надолго.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html не кэшируем: иначе после деплоя браузер загрузит старый
    # бандл, который ссылается на удалённые файлы.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # --- API ---------------------------------------------------------------
    location = /metrics {
        deny all;
        access_log off;
    }

    # Служебные эндпоинты API не должны попадать под раздачу статики,
    # иначе /docs отдаст index.html вместо Swagger UI.
    location ~ ^/(health|docs|redoc|openapi\.json)$ {
        proxy_pass http://picnest_api;
        include /etc/nginx/snippets/picnest-proxy.conf;
    }

    location ~ ^/api/v1/auth/(login|register|refresh) {
        limit_req zone=picnest_auth burst=8 nodelay;
        limit_conn picnest_conn 20;

        proxy_pass http://picnest_api;
        include /etc/nginx/snippets/picnest-proxy.conf;
    }

    location /api/ {
        limit_req zone=picnest_api burst=40 nodelay;
        limit_conn picnest_conn 50;

        proxy_pass http://picnest_api;
        include /etc/nginx/snippets/picnest-proxy.conf;
    }

    # --- SPA ---------------------------------------------------------------
    # Любой неизвестный путь отдаёт index.html: маршрутизацией занимается
    # react-router, а не nginx.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
