# ============================================================================
# PicNest — nginx (хост Ubuntu, /etc/nginx/sites-available/picnest)
# ============================================================================
# Схема: клиент → nginx :80/:443 (хост) → app:8000 (docker, только loopback)
#
# HTTPS: этот файл намеренно содержит только HTTP. После того как DNS для
# api.picnest.ru начнёт указывать на сервер, выполните:
#
#     certbot --nginx -d api.picnest.ru
#
# Certbot сам добавит listen 443 ssl, сертификаты и редирект с 80 на 443.
# Писать TLS-блок вручную до получения сертификата нельзя: nginx не
# запустится, если файлов сертификата ещё нет.
# ============================================================================

# --- Rate limiting (уровень nginx, до попадания в приложение) ---------------
# Две зоны: общая и жёсткая для эндпоинтов аутентификации (brute-force).
limit_req_zone $binary_remote_addr zone=picnest_api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=picnest_auth:10m rate=5r/s;
limit_conn_zone $binary_remote_addr zone=picnest_conn:10m;

# --- Upstream: приложение в docker ------------------------------------------
# keepalive держит соединения к uvicorn открытыми — меньше TCP-хендшейков.
upstream picnest_api {
    server 127.0.0.1:8000;
    keepalive 32;
}

# WebSocket (на будущее: стриминг статусов заказов, чат)
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;

    server_name api.picnest.ru 83.141.67.249 _;

    # Скрываем версию nginx в заголовках и на страницах ошибок
    server_tokens off;

    # Тело запроса: сюда приходят только JSON и формы. Загрузка фото идёт
    # через отдельный эндпоинт/хранилище — поднимите лимит, если фото
    # загружаются прямо в API.
    client_max_body_size 10m;
    client_body_timeout 30s;
    client_header_timeout 30s;

    # Логи
    access_log /var/log/nginx/picnest-access.log;
    error_log  /var/log/nginx/picnest-error.log warn;

    # --- Базовые заголовки безопасности ------------------------------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # HSTS включается только когда заработает HTTPS — иначе браузер
    # запомнит редирект и сломает доступ по HTTP до истечения max-age.

    # --- Скрытые файлы и служебные пути ------------------------------------
    # .git, .env, .htaccess и прочее — наружу не отдаём никогда
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    location ~* \.(git|env|ini|log|bak|sql|py|sh)$ {
        deny all;
        access_log off;
        log_not_found off;
    }

    # --- Метрики не публикуются --------------------------------------------
    # Prometheus собирает их внутри docker-сети (app:8000/metrics).
    # Снаружи закрываем: там внутренняя телеметрия, а не публичный API.
    location = /metrics {
        deny all;
        access_log off;
    }

    # --- Аутентификация: жёсткий лимит -------------------------------------
    location ~ ^/api/v1/auth/(login|register|refresh) {
        limit_req zone=picnest_auth burst=8 nodelay;
        limit_conn picnest_conn 20;

        proxy_pass http://picnest_api;
        include /etc/nginx/snippets/picnest-proxy.conf;
    }

    # --- Основное приложение -----------------------------------------------
    location / {
        limit_req zone=picnest_api burst=40 nodelay;
        limit_conn picnest_conn 50;

        proxy_pass http://picnest_api;
        include /etc/nginx/snippets/picnest-proxy.conf;
    }
}
