# ============================================================================
# PicNest Marketplace API - GitHub Actions Workflow for Deployment
# ============================================================================
# Автоматический деплой при push в main branch
# Триггеры: push to main branch, release tags
# Шаги: checkout, login Docker Hub, build and push image, deploy to server
# Автор: PicNest Backend Team
# Дата: 2026-10-21
# ============================================================================

name: Deploy to Production

on:
  push:
    branches:
      - main
      - 'release/**'
  release:
    types: [published]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ==========================================================================
  # Job: Build and Push Docker Image to GitHub Container Registry
  # ==========================================================================

  build-and-push-ghcr:
    name: Build and Push GHCR
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=

      - name: Build and push Docker image (runtime)
        uses: docker/build-push-action@v5
        with:
          context: .
          target: runtime
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Docker image (debug)
        uses: docker/build-push-action@v5
        with:
          context: .
          target: debug
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}-debug
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ==========================================================================
  # Job: Deploy to Production Server (SSH)
  # ==========================================================================

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build-and-push-ghcr]

    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/main')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to production server via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.PROD_SERVER_HOST }}
          username: ${{ secrets.PROD_SERVER_USERNAME }}
          key: ${{ secrets.PROD_SERVER_SSH_KEY }}
          port: 22
          script: |
            # Update repository
            cd /var/www/picnest-api

            # Pull latest changes
            git pull origin main

            # Stop containers (gracefully)
            docker-compose down --remove-orphans || true

            # Login to Docker Hub/Registry
            echo "${{ secrets.DOCKER_PASSWORD }}" | docker login ghcr.io/${{ github.actor }} -u ${{ github.actor }}

            # Pull latest image
            docker pull ghcr.io/${{ github.repository }}:${{ github.sha }}

            # Update compose file with new tag
            sed -i "s|image: picnest/picnest-api:.*|image: ghcr.io/${{ github.repository }}:${{ github.sha }}|" /var/www/picnest-api/docker-compose.yml

            # Start containers with new image
            docker-compose up -d --force-recreate app db redis

            # Wait for health check
            echo "Waiting for services to be healthy..."
            sleep 30

            # Verify health status
            curl -f http://localhost:8000/health || exit 1

            # Clean up old images
            docker image prune -f

            # Log completion
            echo "Deployment completed successfully!"

  # ==========================================================================
  # Job: Deploy to Staging Server (SSH)
  # ==========================================================================

  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [build-and-push-ghcr]

    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/release/')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to staging server via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.STAGING_SERVER_HOST }}
          username: ${{ secrets.STAGING_SERVER_USERNAME }}
          key: ${{ secrets.STAGING_SERVER_SSH_KEY }}
          port: 22
          script: |
            cd /var/www/picnest-api-staging

            git pull origin release

            docker-compose down --remove-orphans || true

            echo "${{ secrets.DOCKER_PASSWORD }}" | docker login ghcr.io/${{ github.actor }} -u ${{ github.actor }}

            docker pull ghcr.io/${{ github.repository }}:${{ github.sha }}

            sed -i "s|image: picnest/picnest-api:.*|image: ghcr.io/${{ github.repository }}:${{ github.sha }}|" /var/www/picnest-api-staging/docker-compose.yml

            docker-compose up -d --force-recreate app db redis

            sleep 30
            curl -f http://localhost:8000/health || exit 1

            echo "Staging deployment completed successfully!"

  # ==========================================================================
  # Job: Deploy to Kubernetes (Optional)
  # ==========================================================================

  deploy-kubernetes:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: [build-and-push-ghcr]

    if: github.event_name == 'release' && github.event.action == 'published'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'

      - name: Configure kubectl
        run: |
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > ~/.kube/config

      - name: Update deployment image
        run: |
          kubectl set image deployment/picnest-api             picnest-api=ghcr.io/${{ github.repository }}:${{ github.sha }}             --namespace=production

      - name: Rollout status
        run: |
          kubectl rollout status deployment/picnest-api --namespace=production --timeout=300s

  # ==========================================================================
  # Job: Notify Deployment Status
  # ==========================================================================

  notify-status:
    name: Notify Deployment Status
    runs-on: ubuntu-latest
    needs: [deploy-production, deploy-staging, deploy-kubernetes]

    if: always()

    steps:
      - name: Send notification to Slack/Teams
        uses: slackapi/slack-github-action@v1.26.0
        with:
          payload: |
            {
              "text": "${{ needs.deploy-production.result == 'success' && '✅ Production deployment successful!' || '❌ Deployment failed! Check GitHub Actions for details.' }}",
              "channel": "#deployments"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_DEPLOYMENT_WEBHOOK }}

# ==========================================================================
# Job: Rollback on Failure (Optional)
# ==========================================================================

rollback-on-failure:
  name: Rollback on Failure
  runs-on: ubuntu-latest
  needs: [deploy-production]

  if: always() && needs.deploy-production.result == 'failure'

  steps:
    - name: Trigger rollback
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.PROD_SERVER_HOST }}
        username: ${{ secrets.PROD_SERVER_USERNAME }}
        key: ${{ secrets.PROD_SERVER_SSH_KEY }}
        port: 22
        script: |
          cd /var/www/picnest-api

          # Stop current deployment
          docker-compose down || true

          # Restore previous image (tagged as latest before failed deploy)
          sed -i "s|image: ghcr.io/.*/.*:latest|image: ghcr.io/${{ github.repository }}:previous-tag|" /var/www/picnest-api/docker-compose.yml

          docker-compose up -d --force-recreate app db redis

          echo "Rollback completed!"
