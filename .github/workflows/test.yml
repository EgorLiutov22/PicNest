# ============================================================================
# PicNest Marketplace API - GitHub Actions Workflow for Testing
# ============================================================================
# Автоматическое тестирование при каждом push и pull request
# Триггеры: push, pull_request
# Шаги: checkout, setup Python, install dependencies, linting, testing, coverage
# Автор: PicNest Backend Team
# Дата: 2026-10-21
# ============================================================================

name: Test and Lint

on:
  push:
    branches:
      - main
      - develop
      - 'release/**'
  pull_request:
    branches:
      - main
      - develop
      - 'release/**'

jobs:
  # ==========================================================================
  # Job: Lint and Format Check
  # ==========================================================================

  lint:
    name: Lint Code
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 black isort mypy ruff

      - name: Run flake8 (code quality)
        run: |
          echo "Running flake8..."
          flake8 app/ tests/ --max-line-length=120 --exclude=__pycache__,migrations
        continue-on-error: true

      - name: Check formatting with black
        run: |
          echo "Checking code formatting..."
          black --check app/ tests/
        continue-on-error: true

      - name: Sort imports with isort
        run: |
          echo "Checking import order..."
          isort --check-only app/ tests/
        continue-on-error: true

      - name: Run ruff (modern linter)
        run: |
          echo "Running ruff linter..."
          pip install ruff
          ruff check app/ tests/
        continue-on-error: true

      - name: Type checking with mypy
        run: |
          echo "Running type checker..."
          pip install mypy
          mypy app/ --ignore-missing-imports --strict
        continue-on-error: true

  # ==========================================================================
  # Job: Unit Tests (Python 3.11)
  # ==========================================================================

  test-python-311:
    name: Test Python 3.11
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:14-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov httpx

      - name: Set environment variables
        run: |
          echo "DATABASE_URL=postgresql+asyncpg://test_user:test_pass@localhost:5432/test_db" >> $GITHUB_ENV
          echo "REDIS_URL=redis://localhost:6379/0" >> $GITHUB_ENV
          echo "SECRET_KEY=test-secret-key-for-testing-only" >> $GITHUB_ENV
          echo "ENVIRONMENT=test" >> $GITHUB_ENV

      - name: Run tests with pytest
        run: |
          echo "Running pytest..."
          pytest             tests/             -v             --cov=app             --cov-report=term-missing             --cov-report=xml             --cov-report=html             --maxfail=5             --tb=short

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pytest-results-python311
          path: pytest_results/

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          flags: unittests,python311
          name: codecov-umbrella
          fail_ci_if_error: false

  # ==========================================================================
  # Job: Test on Python 3.12 (Latest)
  # ==========================================================================

  test-python-312:
    name: Test Python 3.12
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:14-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov httpx

      - name: Set environment variables
        run: |
          echo "DATABASE_URL=postgresql+asyncpg://test_user:test_pass@localhost:5432/test_db" >> $GITHUB_ENV
          echo "SECRET_KEY=test-secret-key-for-testing-only" >> $GITHUB_ENV
          echo "ENVIRONMENT=test" >> $GITHUB_ENV

      - name: Run tests with pytest
        run: |
          pytest             tests/             -v             --cov=app             --cov-report=term-missing             --cov-report=xml             --maxfail=5

  # ==========================================================================
  # Job: Security Scan (Optional)
  # ==========================================================================

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install security tools
        run: |
          pip install bandit safety

      - name: Run Bandit (security linter)
        run: |
          echo "Running Bandit security scanner..."
          bandit -r app/ -f json > bandit-results.json || true

      - name: Run Safety (dependency check)
        run: |
          echo "Checking dependencies for vulnerabilities..."
          safety check --json > safety-results.json || true

      - name: Upload security results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-scan-results
          path: |
            bandit-results.json
            safety-results.json

  # ==========================================================================
  # Job: Integration Tests (PostgreSQL + Redis)
  # ==========================================================================

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:14-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_pass
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx

      - name: Set environment variables
        run: |
          echo "DATABASE_URL=postgresql+asyncpg://test_user:test_pass@localhost:5432/test_db" >> $GITHUB_ENV
          echo "REDIS_URL=redis://localhost:6379/0" >> $GITHUB_ENV

      - name: Run integration tests
        run: |
          pytest             tests/integration_tests.py             -v             --tb=short

  # ==========================================================================
  # Job: Build Docker Image (Optional)
  # ==========================================================================

  docker-build-test:
    name: Test Docker Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (no push)
        run: |
          docker build --target runtime             --progress=plain             --tag picnest-api:test             .

      - name: Test container health check
        run: |
          echo "Testing container health..."
          # Start container in background
          docker run -d --name test-container picnest-api:test &
          sleep 5

          # Check if healthy (should fail since no database)
          # This is just to verify the HEALTHCHECK instruction works
          docker inspect --format='{{.State.Health.Status}}' test-container || true

          # Stop and remove container
          docker stop test-container
          docker rm -f test-container

# ==========================================================================
# Job: Code Coverage Summary (runs after all tests)
# ==========================================================================

coverage-summary:
  name: Coverage Summary
  runs-on: ubuntu-latest

  needs: [test-python-311, test-python-312]

  steps:
    - name: Download coverage reports
      uses: actions/download-artifact@v4
      with:
        pattern: coverage-*
        merge-multiple: true

    - name: Show coverage summary
      run: |
        echo "Coverage reports downloaded successfully"
        ls -la

# ==========================================================================
# On Failure Notification (Optional)
# ==========================================================================

on-failure-notification:
  name: Notify on Failure
  runs-on: ubuntu-latest

  needs: [lint, test-python-311, test-python-312, security-scan]
  if: failure() && github.event_name == 'pull_request'

  steps:
    - name: Send notification to Slack/Teams
      # Add your notification logic here (Slack webhook, Teams, etc.)
      run: |
        echo "Workflow failed! Check GitHub Actions for details."
