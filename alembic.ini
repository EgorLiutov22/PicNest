# ============================================================================
# Alembic configuration для PicNest
# ============================================================================
# URL базы данных НЕ хранится здесь: env.py читает DATABASE_URL из окружения
# (или из .env). Это позволяет использовать один и тот же конфиг локально,
# в CI и в production-контейнере.
# ============================================================================

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os
# Имена файлов ревизий: <дата>_<slug>.py — читаемее, чем хэши
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s
timezone = UTC
# Пустая строка — подставляется в env.py из DATABASE_URL
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
